[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-research"
version = "0.1.0"
description = "Research infrastructure for evaluating and understanding machine discovery"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0+cpu",
  "transformers==4.57.6",
  "huggingface-hub==0.36.2",
  "safetensors==0.8.0",
  "numpy==2.5.4",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
novel-smoke = "novel.runner:main"
novel-model = "novel.models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
required-version = "==0.12.23"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
exclude-newer = "2026-10-12T00:00:00Z"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "gpu: requires an explicitly enabled CUDA reference environment",
  "integration: requires an explicitly downloaded pinned pretrained snapshot",
]
